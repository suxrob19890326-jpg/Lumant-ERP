<!DOCTYPE html>
<!-- Bosh sahifa: avval login, keyin bo'limlar menyusi -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumant ERP</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lumant ERP">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8731A">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase kutubxonasi: bitta fayl, o'zimizning saytdan (tez yuklanadi) -->
  <script src="vendor/supabase-2.119.2.js" defer></script>
  <link rel="modulepreload" href="db.js">
  <link rel="modulepreload" href="config.js">
</head>
<body>
  <header>
    <img src="logo.png" alt="Lumant ERP logotipi" class="logo">
    <h1>Lumant ERP</h1>
    <p class="subtitle">Beton mahsulotlari korxonasi uchun boshqaruv tizimi</p>
  </header>

  <!-- 1) LOGIN FORMASI: tizimga kirmagan bo'lsa ko'rinadi -->
  <form id="login" class="panel" hidden onsubmit="event.preventDefault()">
    <h2>Tizimga kirish</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="parol" type="password" placeholder="Parol" autocomplete="current-password" required>
    <button type="submit" id="kirish">Kirish</button>
    <p id="xato" class="xato"></p>
  </form>

  <!-- 2) MENYU: kirgandan keyin ko'rinadi -->
  <main id="menyu" hidden>
    <a class="card" href="yozuv.html">✍️ Yangi yozuv</a>
    <a class="card" href="sverka.html">💰 Qarzlar va sverka</a>
    <a class="card" href="kassa.html">💵 Kassa</a>
    <a class="card" href="ombor.html">📦 Ombor</a>
    <a class="card" href="ishlab.html">🏭 Ishlab chiqarish</a>
    <p class="kim">Siz: <b id="kim"></b> · <a href="#" id="chiqish">Chiqish</a></p>
  </main>

  <footer>Kogon tumani · Lumant Beton</footer>

  <script type="module">
    import { db } from './db.js';

    const login = document.getElementById('login');
    const menyu = document.getElementById('menyu');

    async function korsat() {
      const { data } = await db.auth.getSession();
      const user = data.session?.user;
      login.hidden = !!user;
      menyu.hidden = !user;
      if (user) document.getElementById('kim').textContent = user.email;
    }

    login.addEventListener('submit', async (e) => {
      e.preventDefault();
      const xato = document.getElementById('xato');
      const tugma = document.getElementById('kirish');
      xato.textContent = 'Tekshirilmoqda...';
      tugma.disabled = true;
      let error;
      try {
        ({ error } = await db.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('parol').value,
        }));
      } catch (e) { error = e; }
      tugma.disabled = false;
      if (!error) xato.textContent = '';
      else if (error.status === 400) xato.textContent = 'Email yoki parol noto\'g\'ri';
      else xato.textContent = 'Internet yoki serverda xato. Qayta urinib ko\'ring.';
      korsat();
    });

    document.getElementById('chiqish').addEventListener('click', async (e) => {
      e.preventDefault();
      await db.auth.signOut();
      korsat();
    });

    korsat();
  </script>
</body>
</html>
