<!DOCTYPE html>
<!-- Sverka: mijozni tanlash → qoldiq va barcha yozuvlar (Sheets'dagi "Sverka" varag'i kabi) -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sverka · Lumant ERP</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8731A">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase kutubxonasi: bitta fayl, o'zimizning saytdan (tez yuklanadi) -->
  <script src="vendor/supabase-2.119.2.js" defer></script>
  <link rel="modulepreload" href="db.js">
  <link rel="modulepreload" href="config.js">
</head>
<body>
  <header class="kichik">
    <a href="index.html" class="orqaga">‹ Menyu</a>
    <h1>Sverka</h1>
  </header>

  <section class="panel">
    <!-- Qidiruv: yozganingiz sari mos mijozlar pastda chiqadi -->
    <input id="qidir" placeholder="Mijoz nomini yozing..." autocomplete="off">
    <ul id="takliflar" class="takliflar" hidden></ul>
    <p id="holat" class="soni">Mijozlar yuklanmoqda...</p>

    <div id="natija" hidden>
      <div class="qoldiq">
        <span id="mijozNomi"></span>
        <b id="qoldiq"></b>
        <small id="izohQoldiq"></small>
      </div>
      <a id="yozuvga" class="tugma-ikkinchi" href="yozuv.html">➕ Yozuv qo'shish</a>
      <p class="soni"><span id="soni"></span> ta yozuv</p>
      <div id="qatorlar"></div>
    </div>
  </section>

  <script type="module">
    import { db, loginShart, pul, sana, toza } from './db.js';

    await loginShart();

    // Yozuv turlarining ko'rinishi
    const TUR = {
      yuk_berildi:     '',
      mahsulot_olindi: '⬇️ ',
      tolov_keldi:     '💵 To\'lov',
      pul_berildi:     '💸 Pul berildi',
      tuzatish:        '✏️ Tuzatish',
    };

    // 1) Mijozlar ro'yxatini bir marta yuklab olamiz
    const holat = document.getElementById('holat');
    const { data: mijozlar, error } = await db
      .from('mijoz_qoldiq').select('id, nomi, qoldiq').order('nomi');
    if (error) { holat.textContent = 'Xato: ' + error.message; throw error; }
    holat.textContent = mijozlar.length + ' ta mijoz';

    // 2) Tez qidiruv
    const qidir = document.getElementById('qidir');
    const takliflar = document.getElementById('takliflar');

    qidir.addEventListener('input', () => {
      const soz = qidir.value.trim().toLowerCase();
      if (!soz) { takliflar.hidden = true; return; }
      const mos = mijozlar.filter(m => m.nomi.toLowerCase().includes(soz)).slice(0, 15);
      takliflar.innerHTML = mos.map(m =>
        `<li data-id="${toza(m.id)}"><span>${toza(m.nomi)}</span><small>${pul(m.qoldiq)}</small></li>`
      ).join('') || '<li class="bosh">Topilmadi</li>';
      takliflar.hidden = false;
    });

    takliflar.addEventListener('click', (e) => {
      const li = e.target.closest('li[data-id]');
      if (!li) return;
      const mijoz = mijozlar.find(m => m.id == li.dataset.id);
      qidir.value = mijoz.nomi;
      takliflar.hidden = true;
      qidir.blur();
      korsat(mijoz);
    });

    // 3) Tanlangan mijozning sverkasi
    let soralgan = 0;   // eng oxirgi tanlangan mijoz (eski javob ustiga yozmasin)
    async function korsat(mijoz) {
      const men = ++soralgan;
      holat.textContent = 'Yuklanmoqda...';
      // Baza bir so'rovda ko'pi bilan 1000 qator beradi — shuning uchun bo'laklab olamiz
      const yozuvlar = [];
      for (let dan = 0; ; dan += 1000) {
        const { data, error } = await db
          .from('yozuvlar')
          .select('id, sana, turi, olchov, miqdor, narx, summa, avto_raqami, izoh, qulf, mahsulotlar(nomi)')
          .eq('mijoz_id', mijoz.id)
          .order('sana').order('id')
          .range(dan, dan + 999);
        if (men !== soralgan) return;
        if (error) { holat.textContent = 'Xato: ' + error.message; return; }
        yozuvlar.push(...data);
        if (data.length < 1000) break;
      }
      holat.textContent = '';

      let qoldiq = 0;
      document.getElementById('qatorlar').innerHTML = yozuvlar.map(y => {
        qoldiq += Number(y.summa || 0);
        const nomi = (TUR[y.turi] || '') + toza(y.mahsulotlar?.nomi);
        const tafsilot = [
          y.miqdor ? `${pul(y.miqdor)} ${toza(y.olchov)}` + (y.narx ? ` × ${pul(y.narx)}` : '') : '',
          y.avto_raqami ? `🚚 ${toza(y.avto_raqami)}` : '',
          toza(y.izoh),
        ].filter(Boolean).join(' · ');
        return `<div class="yozuv ${y.summa < 0 ? 'minus' : ''}">
          <div class="yuqori">
            <span class="sana">${sana(y.sana)}</span>
            <span class="nomi">${nomi} ${y.qulf ? '🔒' : ''}</span>
            <span class="summa">${pul(y.summa)}</span>
          </div>
          <div class="pastki">
            <span>${tafsilot}</span>
            <span class="q">${pul(qoldiq)}</span>
          </div>
        </div>`;
      }).join('');

      document.getElementById('mijozNomi').textContent = mijoz.nomi;
      document.getElementById('qoldiq').textContent = pul(qoldiq) + ' so\'m';
      document.getElementById('izohQoldiq').textContent =
        qoldiq > 0 ? 'Mijoz bizdan qarz' : qoldiq < 0 ? 'Biz mijozdan qarzmiz (avans)' : 'Hisob yopiq';
      document.getElementById('soni').textContent = yozuvlar.length;
      document.getElementById('yozuvga').href = 'yozuv.html?mijoz=' + encodeURIComponent(mijoz.id);
      document.getElementById('natija').hidden = false;
    }

    // 4) Havolada ?mijoz=ID bo'lsa, o'sha mijozni darhol ochamiz
    const oldin = mijozlar.find(m => m.id == new URLSearchParams(location.search).get('mijoz'));
    if (oldin) { qidir.value = oldin.nomi; korsat(oldin); }
  </script>
</body>
</html>
