<!DOCTYPE html>
<!-- Sverka: mijozni tanlash → davr bo'yicha yozuvlar, boshlang'ich/yakuniy qoldiq,
     chop etish (solishtirma dalolatnoma / akt sverki) va Excel -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sverka · Lumant ERP</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8731A">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase kutubxonasi: bitta fayl, o'zimizning saytdan (tez yuklanadi) -->
  <script src="vendor/supabase-2.119.2.js" defer></script>
  <link rel="modulepreload" href="db.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="qidiruv.js">
</head>
<body>
  <header class="kichik ekran">
    <a href="index.html" class="orqaga">‹ Menyu</a>
    <h1>Sverka</h1>
  </header>

  <section class="panel ekran">
    <!-- Qidiruv: yozganingiz sari mos mijozlar pastda chiqadi (lotin yoki kirill) -->
    <input id="qidir" placeholder="Mijoz nomini yozing (lotin yoki kirill)..." autocomplete="off">
    <ul id="takliflar" class="takliflar" hidden></ul>
    <p id="holat" class="soni">Mijozlar yuklanmoqda...</p>

    <div id="natija" hidden>
      <div class="qoldiq">
        <span id="mijozNomi"></span>
        <b id="qoldiq"></b>
        <small id="izohQoldiq"></small>
      </div>
      <a id="yozuvga" class="tugma-ikkinchi" href="yozuv.html">➕ Yozuv qo'shish</a>

      <!-- Davr -->
      <div class="turlar tort davr-tanla" id="davrlar">
        <button type="button" data-d="hammasi">Hammasi</button>
        <button type="button" data-d="oy">Shu oy</button>
        <button type="button" data-d="otganoy">O'tgan oy</button>
        <button type="button" data-d="yil">Yil boshidan</button>
      </div>
      <div class="ikki">
        <label>Dan <input id="dan" type="date"></label>
        <label>Gacha <input id="gacha" type="date"></label>
      </div>

      <div class="davr-jami">
        <div><span>Davr boshida</span><b id="boshQoldiq"></b></div>
        <div><span>Qarz oshdi (+)</span><b id="jamiPlus"></b></div>
        <div><span>Qarz kamaydi (−)</span><b id="jamiMinus" class="kirim"></b></div>
        <div><span>Davr oxirida</span><b id="oxirQoldiq"></b></div>
      </div>

      <div class="ikki">
        <button type="button" id="chop">🖨 Chop etish / PDF</button>
        <button type="button" id="csv" class="tugma-oddiy">⬇️ Excel</button>
      </div>

      <p class="soni"><span id="soni"></span> ta yozuv</p>
      <div id="qatorlar"></div>
    </div>
  </section>

  <!-- Yozuvni tahrirlash (yozuv bosilganda ochiladi) -->
  <form id="tahrir" class="panel ekran" autocomplete="off" hidden onsubmit="event.preventDefault()">
    <h2 class="kichik-sarlavha" id="tSarlavha"></h2>
    <p id="tQulf" class="ogoh" hidden>🔒 Bu yozuv qulflangan — uni hech kim o'zgartira olmaydi.</p>
    <fieldset id="tMaydon">
      <label>Sana <input id="tSana" type="date" required></label>
      <div class="ikki" id="tMiqdorQism">
        <label>Miqdor <input id="tMiqdor" inputmode="decimal"></label>
        <label>Narx <input id="tNarx" inputmode="decimal"></label>
      </div>
      <label>Summa <span id="tBelgi" class="soni"></span> <input id="tSumma" inputmode="decimal"></label>
      <label id="tAvtoQism">Avto raqami <input id="tAvto"></label>
      <label>Izoh <input id="tIzoh"></label>
      <div class="ikki">
        <button type="submit" id="tSaqla">Saqlash</button>
        <button type="button" id="tQulfla" class="tugma-oddiy">🔒 Qulflash</button>
      </div>
    </fieldset>
    <button type="button" id="tYop" class="tugma-oddiy">Yopish</button>
    <p id="tXato" class="xato"></p>
  </form>

  <!-- Chop etish uchun: solishtirma dalolatnoma (faqat printerda / PDF'da ko'rinadi) -->
  <article id="akt" class="akt"></article>

  <script type="module">
    import { db, loginShart, pul, sana, toza, mos, saralash, hammasi, csvYukla, bugun, kunQosh } from './db.js';

    const user = await loginShart('sverka');
    const $ = (id) => document.getElementById(id);

    // Yozuv turlarining ko'rinishi
    const TUR = {
      yuk_berildi:     '',
      mahsulot_olindi: '⬇️ ',
      tolov_keldi:     '💵 To\'lov',
      pul_berildi:     '💸 Pul berildi',
      tuzatish:        '✏️ Tuzatish',
    };
    // Dalolatnoma uchun (emoji'siz)
    const TUR_MATN = {
      yuk_berildi: 'Yuk berildi', mahsulot_olindi: 'Mahsulot olindi',
      tolov_keldi: 'To\'lov keldi', pul_berildi: 'Pul berildi', tuzatish: 'Tuzatish',
    };

    // 1) Mijozlar ro'yxati (1000 tadan ko'p bo'lsa ham hammasi)
    const holat = $('holat');
    const mj = await hammasi(() => db.from('mijoz_qoldiq').select('id, nomi, qoldiq').order('nomi').order('id'));
    if (mj.error) { holat.textContent = 'Xato: ' + mj.error.message; throw mj.error; }
    const mijozlar = mj.data;
    holat.textContent = mijozlar.length + ' ta mijoz';

    // 2) Tez qidiruv
    const qidir = $('qidir');
    const takliflar = $('takliflar');

    qidir.addEventListener('input', () => {
      const soz = qidir.value.trim();
      if (!soz) { takliflar.hidden = true; return; }
      const topildi = saralash(mijozlar.filter(m => mos(m.nomi, soz)), soz).slice(0, 15);
      takliflar.innerHTML = topildi.map(m =>
        `<li data-id="${toza(m.id)}"><span>${toza(m.nomi)}</span><small>${pul(m.qoldiq)}</small></li>`
      ).join('') || '<li class="bosh">Topilmadi</li>';
      takliflar.hidden = false;
    });

    takliflar.addEventListener('click', (e) => {
      const li = e.target.closest('li[data-id]');
      if (!li) return;
      const mijoz = mijozlar.find(m => m.id == li.dataset.id);
      qidir.value = mijoz.nomi;
      takliflar.hidden = true;
      qidir.blur();
      korsat(mijoz);
    });

    // 3) Tanlangan mijozning barcha yozuvlari
    let tanlangan = null;
    let yozuvlar = [];
    let soralgan = 0;   // eng oxirgi tanlangan mijoz (eski javob ustiga yozmasin)
    async function korsat(mijoz) {
      const men = ++soralgan;
      holat.textContent = 'Yuklanmoqda...';
      const { data, error } = await hammasi(() => db
        .from('yozuvlar')
        .select('id, sana, turi, mahsulot_id, olchov, miqdor, narx, summa, avto_raqami, izoh, qulf, mahsulotlar(nomi)')
        .eq('mijoz_id', mijoz.id)
        .order('sana').order('id'));
      if (men !== soralgan) return;
      if (error) { holat.textContent = 'Xato: ' + error.message; return; }
      holat.textContent = '';
      tanlangan = mijoz;
      yozuvlar = data;

      const jami = yozuvlar.reduce((s, y) => s + Number(y.summa || 0), 0);
      $('mijozNomi').textContent = mijoz.nomi;
      $('qoldiq').textContent = pul(jami) + ' so\'m';
      $('izohQoldiq').textContent =
        jami > 0 ? 'Mijoz bizdan qarz' : jami < 0 ? 'Biz mijozdan qarzmiz (avans)' : 'Hisob yopiq';
      $('yozuvga').href = 'yozuv.html?mijoz=' + encodeURIComponent(mijoz.id);
      $('natija').hidden = false;
      if (davrNomi === 'qolda') chiz();          // qo'lda tanlangan sanalar saqlanib qoladi
      else davrTanla(davrNomi || 'hammasi');
    }

    // 4) Davr
    let davrNomi = null;
    function davr(d) {
      const b = bugun();
      const [y, m] = b.split('-').map(Number);
      const oyBoshi = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}-01`;
      if (d === 'oy') return [oyBoshi(y, m), b];
      if (d === 'yil') return [`${y}-01-01`, b];
      if (d === 'otganoy') {
        const [oy, oy_] = m === 1 ? [y - 1, 12] : [y, m - 1];
        return [oyBoshi(oy, oy_), kunQosh(oyBoshi(y, m), -1)];
      }
      return ['', ''];   // hammasi
    }
    function davrTanla(d) {
      davrNomi = d;
      document.querySelectorAll('#davrlar button').forEach(b => b.classList.toggle('tanlangan', b.dataset.d === d));
      [$('dan').value, $('gacha').value] = davr(d);
      chiz();
    }
    $('davrlar').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-d]');
      if (b) davrTanla(b.dataset.d);
    });
    ['dan', 'gacha'].forEach(id => $(id).addEventListener('change', () => {
      davrNomi = 'qolda';
      document.querySelectorAll('#davrlar button').forEach(b => b.classList.remove('tanlangan'));
      chiz();
    }));

    // Davr hisobi: boshlang'ich qoldiq, davr yozuvlari (yugurib boruvchi qoldiq bilan), jami
    function hisob() {
      const dan = $('dan').value, gacha = $('gacha').value;
      let bosh = 0, plus = 0, minus = 0;
      const qatorlar = [];
      let q = 0;
      for (const y of yozuvlar) {
        const s = Number(y.summa || 0);
        if (dan && y.sana < dan) { bosh += s; continue; }
        if (gacha && y.sana > gacha) continue;
        if (!qatorlar.length) q = bosh;
        q += s;
        if (s > 0) plus += s; else minus += s;
        qatorlar.push({ ...y, s, q });
      }
      return { dan, gacha, bosh, plus, minus, oxir: bosh + plus + minus, qatorlar };
    }

    function chiz() {
      if (!tanlangan) return;
      const h = hisob();
      $('boshQoldiq').textContent = pul(h.bosh);
      $('jamiPlus').textContent = pul(h.plus);
      $('jamiMinus').textContent = pul(-h.minus);
      $('oxirQoldiq').textContent = pul(h.oxir);
      $('soni').textContent = h.qatorlar.length;
      $('qatorlar').innerHTML = h.qatorlar.map(y => {
        const nomi = (TUR[y.turi] || '') + toza(y.mahsulotlar?.nomi);
        const tafsilot = [
          y.miqdor ? `${pul(y.miqdor)} ${toza(y.olchov)}` + (y.narx ? ` × ${pul(y.narx)}` : '') : '',
          y.avto_raqami ? `🚚 ${toza(y.avto_raqami)}` : '',
          toza(y.izoh),
        ].filter(Boolean).join(' · ');
        return `<div class="yozuv bosiladi ${y.s < 0 ? 'minus' : ''}" data-id="${toza(y.id)}">
          <div class="yuqori">
            <span class="sana">${sana(y.sana)}</span>
            <span class="nomi">${nomi} ${y.qulf ? '🔒' : ''}</span>
            <span class="summa">${pul(y.summa)}</span>
          </div>
          <div class="pastki">
            <span>${tafsilot}</span>
            <span class="q">${pul(y.q)}</span>
          </div>
        </div>`;
      }).join('') || '<p class="soni">Bu davrda yozuv yo\'q</p>';
    }

    // 5) Chop etish: solishtirma dalolatnoma
    const mazmun = (y) => [TUR_MATN[y.turi] || y.turi, y.mahsulotlar?.nomi, y.avto_raqami && `avto ${y.avto_raqami}`, y.izoh]
      .filter(Boolean).join(', ');
    $('chop').addEventListener('click', () => {
      const h = hisob();
      const davrMatn = h.dan || h.gacha
        ? `${h.dan ? sana(h.dan) : 'boshidan'} — ${sana(h.gacha || bugun())}`
        : `boshidan — ${sana(bugun())}`;
      const qolMatn = (x) => x > 0 ? `${pul(x)} so'm — mijoz Lumant Beton'dan qarzdor`
        : x < 0 ? `${pul(-x)} so'm — Lumant Beton mijozdan qarzdor (avans)` : 'qarzdorlik yo\'q';
      $('akt').innerHTML = `
        <h2>SOLISHTIRMA DALOLATNOMA</h2>
        <p class="akt-osti">(Акт сверки взаиморасчётов)</p>
        <table class="akt-bosh">
          <tr><td>Tomonlar:</td><td><b>Lumant Beton</b> (Kogon tumani) va <b>${toza(tanlangan.nomi)}</b></td></tr>
          <tr><td>Davr:</td><td>${davrMatn}</td></tr>
          <tr><td>Tuzilgan sana:</td><td>${sana(bugun())}</td></tr>
        </table>
        <table class="akt-jadval">
          <thead><tr>
            <th>№</th><th>Sana</th><th>Mazmuni</th><th>Miqdor</th><th>Narx</th>
            <th>Debet<br><small>(qarz +)</small></th><th>Kredit<br><small>(qarz −)</small></th><th>Qoldiq</th>
          </tr></thead>
          <tbody>
            <tr class="akt-jami"><td></td><td></td><td colspan="5">Davr boshidagi qoldiq</td><td>${pul(h.bosh)}</td></tr>
            ${h.qatorlar.map((y, i) => `<tr>
              <td>${i + 1}</td><td>${sana(y.sana)}</td><td>${toza(mazmun(y))}</td>
              <td>${y.miqdor ? pul(y.miqdor) + ' ' + toza(y.olchov) : ''}</td><td>${pul(y.narx)}</td>
              <td>${y.s > 0 ? pul(y.s) : ''}</td><td>${y.s < 0 ? pul(-y.s) : ''}</td><td>${pul(y.q)}</td>
            </tr>`).join('')}
            <tr class="akt-jami"><td></td><td></td><td colspan="3">Davr aylanmasi</td>
              <td>${pul(h.plus)}</td><td>${pul(-h.minus)}</td><td></td></tr>
            <tr class="akt-jami"><td></td><td></td><td colspan="5">Davr oxiridagi qoldiq</td><td>${pul(h.oxir)}</td></tr>
          </tbody>
        </table>
        <p class="akt-xulosa"><b>Xulosa:</b> ${sana(h.gacha || bugun())} holatiga ${qolMatn(h.oxir)}.</p>
        <div class="akt-imzo">
          <div><b>Lumant Beton</b><br><br>__________________ / __________________<br><small>imzo / F.I.Sh.</small></div>
          <div><b>${toza(tanlangan.nomi)}</b><br><br>__________________ / __________________<br><small>imzo / F.I.Sh.</small></div>
        </div>`;
      window.print();
    });

    // 6) Excel
    $('csv').addEventListener('click', () => {
      const h = hisob();
      const fayl = `sverka-${tanlangan.nomi.replace(/[\\/:*?"<>|]+/g, ' ').trim()}-${h.dan || 'boshidan'}_${h.gacha || bugun()}`;
      csvYukla(fayl,
        ['Sana', 'Turi', 'Mahsulot', 'Miqdor', 'O\'lchov', 'Narx', 'Debet (qarz +)', 'Kredit (qarz −)', 'Qoldiq', 'Avto', 'Izoh'],
        [['', 'Davr boshidagi qoldiq', '', '', '', '', '', '', h.bosh, '', ''],
         ...h.qatorlar.map(y => [sana(y.sana), TUR_MATN[y.turi] || y.turi, y.mahsulotlar?.nomi || '',
           y.miqdor ?? '', y.olchov || '', y.narx ?? '', y.s > 0 ? y.s : '', y.s < 0 ? -y.s : '', y.q,
           y.avto_raqami || '', y.izoh || '']),
         ['', 'Davr oxiridagi qoldiq', '', '', '', '', h.plus, -h.minus, h.oxir, '', '']]);
    });

    // 7) Yozuvni tahrirlash / qulflash
    function son(s) {
      const t = String(s).replace(/\s/g, '').replace(',', '.');
      if (!t) return null;
      const n = Number(t);
      return Number.isFinite(n) ? n : NaN;
    }
    let tYozuv = null, tSummaQolda = false;
    $('qatorlar').addEventListener('click', (e) => {
      const el = e.target.closest('[data-id]');
      if (el) tahrirOch(yozuvlar.find(y => y.id == el.dataset.id));
    });
    function tahrirOch(y) {
      tYozuv = y;
      tSummaQolda = false;
      const tuz = y.turi === 'tuzatish';
      $('tSarlavha').textContent = `${sana(y.sana)} · ${(TUR_MATN[y.turi] || y.turi)}${y.mahsulotlar?.nomi ? ' · ' + y.mahsulotlar.nomi : ''}`;
      $('tQulf').hidden = !y.qulf;
      $('tMaydon').disabled = !!y.qulf;
      $('tMaydon').hidden = !!y.qulf;
      $('tQulfla').hidden = !['admin', 'rahbar'].includes(user.rol);   // qulflash — faqat admin/rahbar
      $('tSana').value = y.sana;
      $('tMiqdorQism').hidden = !y.mahsulot_id && !y.miqdor;
      $('tAvtoQism').hidden = !y.mahsulot_id && !y.avto_raqami;
      $('tMiqdor').value = y.miqdor ?? '';
      $('tNarx').value = y.narx ?? '';
      $('tSumma').value = y.summa == null ? '' : tuz ? y.summa : Math.abs(y.summa);
      $('tBelgi').textContent = tuz ? '(+ qarz oshadi, − kamayadi)' : Number(y.summa) < 0 ? '(qarzni kamaytiradi)' : '(qarzni oshiradi)';
      $('tAvto').value = y.avto_raqami || '';
      $('tIzoh').value = y.izoh || '';
      $('tXato').textContent = '';
      $('tXato').classList.remove('ok');
      $('tahrir').hidden = false;
      $('tahrir').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    $('tYop').addEventListener('click', () => { $('tahrir').hidden = true; tYozuv = null; });
    $('tSumma').addEventListener('input', () => { tSummaQolda = true; });
    ['tMiqdor', 'tNarx'].forEach(id => $(id).addEventListener('input', () => {
      const m = son($('tMiqdor').value), n = son($('tNarx').value);
      if (!tSummaQolda && m > 0 && n > 0) $('tSumma').value = Math.round(m * n * 100) / 100;
    }));

    async function tSaqla(ozgarish, xabar) {
      const tugmalar = [$('tSaqla'), $('tQulfla')];
      tugmalar.forEach(b => b.disabled = true);
      const { error } = await db.from('yozuvlar').update(ozgarish).eq('id', tYozuv.id);
      tugmalar.forEach(b => b.disabled = false);
      if (error) {
        $('tXato').textContent = /qulflangan/i.test(error.message)
          ? 'Bu yozuv qulflangan, uni o\'zgartirib bo\'lmaydi' : 'Saqlanmadi: ' + error.message;
        return;
      }
      const id = tYozuv.id;
      await korsat(tanlangan);                       // yangilangan yozuvlar va qoldiq
      const yangi = yozuvlar.find(y => y.id === id);
      if (yangi) tahrirOch(yangi);
      $('tXato').textContent = xabar;
      $('tXato').classList.add('ok');
    }

    $('tahrir').addEventListener('submit', async () => {
      if (!tYozuv || tYozuv.qulf) return;
      const xato = $('tXato');
      xato.textContent = '';
      xato.classList.remove('ok');
      const tuz = tYozuv.turi === 'tuzatish';
      const sana_ = $('tSana').value;
      if (!sana_) { xato.textContent = 'Sanani tanlang'; return; }
      const ozg = { sana: sana_, izoh: $('tIzoh').value.trim() || null };
      if (!$('tMiqdorQism').hidden) {
        const m = son($('tMiqdor').value), n = son($('tNarx').value);
        if (Number.isNaN(m) || (m !== null && m <= 0)) { xato.textContent = 'Miqdorni to\'g\'ri yozing'; return; }
        if (Number.isNaN(n) || (n !== null && n < 0)) { xato.textContent = 'Narxni to\'g\'ri yozing'; return; }
        ozg.miqdor = m; ozg.narx = n;
      }
      if (!$('tAvtoQism').hidden) ozg.avto_raqami = $('tAvto').value.trim() || null;
      const s = son($('tSumma').value);
      if (s === null || Number.isNaN(s) || (!tuz && s <= 0) || s === 0) { xato.textContent = 'Summani to\'g\'ri yozing'; return; }
      ozg.summa = s;   // belgini (+/−) baza turiga qarab o'zi qo'yadi (tuzatishda — yozilganidek)
      await tSaqla(ozg, '✅ Saqlandi');
    });

    $('tQulfla').addEventListener('click', async () => {
      if (!tYozuv || tYozuv.qulf) return;
      if (!confirm('Yozuv qulflansinmi? Qulflangandan keyin uni HECH KIM o\'zgartira olmaydi.')) return;
      await tSaqla({ qulf: true }, '🔒 Qulflandi');
    });

    // 8) Havolada ?mijoz=ID bo'lsa, o'sha mijozni darhol ochamiz
    const oldin = mijozlar.find(m => m.id == new URLSearchParams(location.search).get('mijoz'));
    if (oldin) { qidir.value = oldin.nomi; korsat(oldin); }
  </script>
</body>
</html>
