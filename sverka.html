<!DOCTYPE html>
<!-- Sverka: mijozni tanlash → qoldiq va barcha yozuvlar (Sheets'dagi "Sverka" varag'i kabi) -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sverka · Lumant ERP</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kichik">
    <a href="index.html" class="orqaga">‹ Menyu</a>
    <h1>Sverka</h1>
  </header>

  <section class="panel">
    <input id="qidir" list="mijozlar" placeholder="Mijoz nomini yozing..." autocomplete="off">
    <datalist id="mijozlar"></datalist>

    <div id="natija" hidden>
      <div class="qoldiq">
        <span>Jami qoldiq</span>
        <b id="qoldiq"></b>
        <small id="izohQoldiq"></small>
      </div>
      <p class="soni"><span id="soni"></span> ta yozuv</p>
      <div class="jadval-oyna">
        <table>
          <thead>
            <tr>
              <th>Sana</th><th>Mahsulot</th><th>Miqdor</th><th>Narx</th>
              <th>Summa</th><th>Qoldiq</th><th>Avto</th><th>Izoh</th>
            </tr>
          </thead>
          <tbody id="qatorlar"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script type="module">
    import { db, loginShart, pul, sana } from './db.js';

    await loginShart();

    // 1) Mijozlar ro'yxatini yuklash (qidiruv uchun)
    const { data: mijozlar, error } = await db
      .from('mijoz_qoldiq').select('id, nomi, qoldiq').order('nomi');
    if (error) alert('Xato: ' + error.message);

    const royxat = document.getElementById('mijozlar');
    royxat.innerHTML = mijozlar.map(m => `<option value="${m.nomi}">`).join('');

    // 2) Mijoz tanlanganda sverkani ko'rsatish
    document.getElementById('qidir').addEventListener('change', async (e) => {
      const mijoz = mijozlar.find(m => m.nomi === e.target.value.trim());
      if (!mijoz) return;

      const { data: yozuvlar } = await db
        .from('yozuvlar')
        .select('sana, turi, olchov, miqdor, narx, summa, avto_raqami, izoh, qulf, mahsulotlar(nomi)')
        .eq('mijoz_id', mijoz.id)
        .order('sana').order('id');

      let qoldiq = 0;
      document.getElementById('qatorlar').innerHTML = yozuvlar.map(y => {
        qoldiq += Number(y.summa || 0);
        const nomi = y.mahsulotlar?.nomi || '';
        return `<tr class="${y.summa < 0 ? 'minus' : ''}">
          <td>${sana(y.sana)}</td>
          <td>${nomi} ${y.qulf ? '🔒' : ''}</td>
          <td>${y.miqdor ? pul(y.miqdor) + ' ' + (y.olchov || '') : ''}</td>
          <td>${pul(y.narx)}</td>
          <td class="raqam">${pul(y.summa)}</td>
          <td class="raqam"><b>${pul(qoldiq)}</b></td>
          <td>${y.avto_raqami || ''}</td>
          <td>${y.izoh || ''}</td>
        </tr>`;
      }).join('');

      document.getElementById('qoldiq').textContent = pul(qoldiq) + ' so\'m';
      document.getElementById('izohQoldiq').textContent =
        qoldiq > 0 ? 'Mijoz bizdan qarz' : qoldiq < 0 ? 'Biz mijozdan qarzmiz (avans)' : 'Hisob yopiq';
      document.getElementById('soni').textContent = yozuvlar.length;
      document.getElementById('natija').hidden = false;
    });
  </script>
</body>
</html>
