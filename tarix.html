<!DOCTYPE html>
<!-- O'zgarishlar tarixi (audit): kim, qachon, nimani, qanday o'zgartirdi -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarix · Lumant ERP</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8731A">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/supabase-2.119.2.js" defer></script>
  <link rel="modulepreload" href="db.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="qidiruv.js">
</head>
<body>
  <header class="kichik">
    <a href="index.html" class="orqaga">‹ Menyu</a>
    <h1>O'zgarishlar tarixi</h1>
  </header>

  <section class="panel">
    <div class="ikki">
      <label>Bo'lim
        <select id="jadval">
          <option value="">Hammasi</option>
          <option value="yozuvlar">Qarz yozuvlari</option>
          <option value="kassa_yozuvlar">Kassa</option>
          <option value="ombor_harakat">Ombor</option>
          <option value="ishlab_chiqarish">Ishlab chiqarish</option>
          <option value="mijozlar">Mijozlar</option>
          <option value="mahsulotlar">Mahsulotlar</option>
          <option value="retseptlar">Retseptlar</option>
          <option value="xodimlar">Xodimlar</option>
        </select>
      </label>
      <label>Amal
        <select id="amal">
          <option value="">Hammasi</option>
          <option value="ozgardi">✏️ O'zgartirildi</option>
          <option value="qoshildi">➕ Qo'shildi</option>
          <option value="ochirildi">🗑 O'chirildi</option>
        </select>
      </label>
    </div>
    <label>Sana <input id="kun" type="date"></label>
    <p id="holat" class="soni">Yuklanmoqda...</p>
    <div id="royxat"></div>
    <button type="button" class="tugma-oddiy" id="koproq" hidden>Yana ko'rsatish</button>
  </section>

  <script type="module">
    import { db, loginShart, pul, sana, toza, hammasi } from './db.js';

    await loginShart('tarix');
    const $ = (id) => document.getElementById(id);

    const JADVAL = {
      yozuvlar: 'Qarz yozuvi', kassa_yozuvlar: 'Kassa', ombor_harakat: 'Ombor', ishlab_chiqarish: 'Ishlab chiqarish',
      mijozlar: 'Mijoz', mahsulotlar: 'Mahsulot', retseptlar: 'Retsept', xodimlar: 'Xodim',
    };
    const AMAL = { qoshildi: '➕ qo\'shildi', ozgardi: '✏️ o\'zgartirildi', ochirildi: '🗑 o\'chirildi' };
    const MAYDON = {
      sana: 'Sana', mijoz_id: 'Mijoz', mahsulot_id: 'Mahsulot', xomashyo_id: 'Xomashyo', turi: 'Turi',
      miqdor: 'Miqdor', narx: 'Narx', summa: 'Summa', avto_raqami: 'Avto', izoh: 'Izoh', qulf: 'Qulf',
      kassa: 'Kassa', yonalish: 'Yo\'nalish', toifa: 'Toifa', sabab: 'Sabab', nomi: 'Nomi', telefon: 'Telefon',
      olchov: 'O\'lchov', oxirgi_narx: 'Narx', turkum: 'Turkum', rol: 'Rol', faol: 'Faol', ism: 'Ism', email: 'Email',
    };
    const YASHIRIN = new Set(['id', 'kiritgan', 'kiritilgan_vaqt', 'created_at', 'user_id', 'eski_kiritgan', 'yozuv_id', 'ishlab_id']);
    const SONLI = new Set(['miqdor', 'narx', 'summa', 'oxirgi_narx']);

    // Raqamlar o'rniga nomlar
    const [mj, mh] = await Promise.all([
      hammasi(() => db.from('mijozlar').select('id, nomi').order('id')),
      hammasi(() => db.from('mahsulotlar').select('id, nomi').order('id')),
    ]);
    const mijozNomi = new Map((mj.data || []).map(x => [x.id, x.nomi]));
    const mahsulotNomi = new Map((mh.data || []).map(x => [x.id, x.nomi]));

    function qiymat(k, v) {
      if (v === null || v === undefined || v === '') return '—';
      if (k === 'mijoz_id') return mijozNomi.get(v) || `#${v}`;
      if (k === 'mahsulot_id' || k === 'xomashyo_id') return mahsulotNomi.get(v) || `#${v}`;
      if (SONLI.has(k)) return pul(v);
      if (k === 'sana') return sana(v);
      if (typeof v === 'boolean') return v ? 'ha' : 'yo\'q';
      return String(v);
    }
    // Yozuv qisqacha: kimniki / nima
    function sarlavha(t) {
      const r = t.yangi || t.eski || {};
      const qism = [r.nomi, r.email, r.mijoz_id && qiymat('mijoz_id', r.mijoz_id),
        r.mahsulot_id && qiymat('mahsulot_id', r.mahsulot_id), r.summa != null && pul(r.summa) + ' so\'m',
        r.miqdor != null && !r.summa && pul(r.miqdor)].filter(Boolean);
      return qism.join(' · ');
    }
    function farq(t) {
      if (t.amal !== 'ozgardi') return '';
      const e = t.eski || {}, y = t.yangi || {};
      return Object.keys({ ...e, ...y })
        .filter(k => !YASHIRIN.has(k) && JSON.stringify(e[k]) !== JSON.stringify(y[k]))
        .map(k => `<div class="farq"><span>${toza(MAYDON[k] || k)}:</span>
          <s>${toza(qiymat(k, e[k]))}</s> → <b>${toza(qiymat(k, y[k]))}</b></div>`).join('');
    }

    // ---------- Ro'yxat ----------
    const BOLAK = 100;
    let royxat = [], tugadi = false, soralgan = 0;
    async function yukla(yangidan) {
      const men = yangidan ? ++soralgan : soralgan;
      if (yangidan) { royxat = []; tugadi = false; }
      let so = db.from('tarix').select('id, vaqt, kim_email, jadval, yozuv_id, amal, eski, yangi')
        .order('id', { ascending: false });
      if ($('jadval').value) so = so.eq('jadval', $('jadval').value);
      if ($('amal').value) so = so.eq('amal', $('amal').value);
      if ($('kun').value) {
        const d = new Date($('kun').value + 'T00:00:00');
        so = so.gte('vaqt', d.toISOString()).lt('vaqt', new Date(d.getTime() + 86400000).toISOString());
      }
      const { data, error } = await so.range(royxat.length, royxat.length + BOLAK - 1);
      if (men !== soralgan) return;
      if (error) {
        $('holat').textContent = /tarix|schema cache|does not exist/i.test(error.message)
          ? 'Tarix hali sozlanmagan: supabase/07_rollar_tarix.sql ni ishga tushiring.' : 'Xato: ' + error.message;
        return;
      }
      royxat.push(...data);
      tugadi = data.length < BOLAK;
      chiz();
    }
    function chiz() {
      $('holat').textContent = royxat.length ? `${royxat.length}${tugadi ? '' : '+'} ta o'zgarish` : 'O\'zgarish topilmadi';
      $('royxat').innerHTML = royxat.map(t => {
        const v = new Date(t.vaqt);
        const vaqt = `${sana(v.toLocaleDateString('sv-SE'))} ${v.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}`;
        return `<div class="yozuv tarix-qator ${t.amal}">
          <div class="yuqori">
            <span class="sana">${vaqt}</span>
            <span class="nomi">${toza(JADVAL[t.jadval] || t.jadval)} ${AMAL[t.amal] || t.amal}</span>
          </div>
          <div class="pastki"><span>${toza(sarlavha(t))}</span><span class="q">${toza(t.kim_email || 'tizim')}</span></div>
          ${farq(t)}
        </div>`;
      }).join('');
      $('koproq').hidden = tugadi;
    }
    ['jadval', 'amal', 'kun'].forEach(id => $(id).addEventListener('change', () => yukla(true)));
    $('koproq').addEventListener('click', () => yukla(false));
    yukla(true);
  </script>
</body>
</html>
