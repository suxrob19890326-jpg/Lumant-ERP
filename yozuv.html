<!DOCTYPE html>
<!-- Yangi yozuv: yuk berildi / to'lov keldi / mahsulot olindi / pul berildi -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yangi yozuv · Lumant ERP</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8731A">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase kutubxonasi: bitta fayl, o'zimizning saytdan (tez yuklanadi) -->
  <script src="vendor/supabase-2.119.2.js" defer></script>
  <link rel="modulepreload" href="db.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="qidiruv.js">
</head>
<body>
  <header class="kichik">
    <a href="index.html" class="orqaga">‹ Menyu</a>
    <h1>Yangi yozuv</h1>
  </header>

  <form id="forma" class="panel" autocomplete="off" onsubmit="event.preventDefault()">
    <!-- 1) Turi -->
    <div class="turlar" id="turlar">
      <button type="button" data-tur="yuk_berildi">🚚 Yuk berildi</button>
      <button type="button" data-tur="tolov_keldi">💵 To'lov keldi</button>
      <button type="button" data-tur="mahsulot_olindi">⬇️ Mahsulot olindi</button>
      <button type="button" data-tur="pul_berildi">💸 Pul berildi</button>
    </div>

    <!-- 2) Sana va mijoz -->
    <label>Sana <input id="sana" type="date" required></label>

    <label>Mijoz
      <input id="qidir" placeholder="Mijoz nomini yozing..." required>
    </label>
    <ul id="takliflar" class="takliflar" hidden></ul>
    <p id="mijozHolat" class="soni"></p>

    <!-- 3) Mahsulot qismi (faqat yuk / mahsulot turlarida) -->
    <div id="mahsulotQism">
      <label>Mahsulot
        <select id="mahsulot"><option value="">— tanlang —</option></select>
      </label>
      <div class="ikki">
        <label>Miqdor <span id="olchov" class="soni"></span>
          <input id="miqdor" inputmode="decimal" placeholder="0">
        </label>
        <label>Narx <span id="narxIzoh" class="soni"></span>
          <input id="narx" inputmode="decimal" placeholder="0">
        </label>
      </div>
      <label>Avto raqami <input id="avto" placeholder="01 A 123 BC"></label>
    </div>

    <!-- 3b) Kassa (faqat to'lov turlarida): pul qaysi kassaga kirdi / qaysidan chiqdi -->
    <div id="kassaQism" hidden>
      <label>Kassa</label>
      <div class="turlar uch" id="kassalar">
        <button type="button" data-k="naqd">💵 Naqd</button>
        <button type="button" data-k="karta">💳 Karta</button>
        <button type="button" data-k="bank">🏦 Bank</button>
        <button type="button" data-k="dollar" hidden>💲 Dollar</button>
      </div>
    </div>

    <!-- 4) Summa: yukda o'zi hisoblanadi, to'lovda qo'lda yoziladi -->
    <label>Summa <span id="summaBelgi" class="soni"></span>
      <input id="summa" inputmode="decimal" placeholder="0">
    </label>
    <p id="tushuntir" class="tushuntir"></p>

    <label>Izoh <input id="izoh" placeholder="ixtiyoriy"></label>

    <button type="submit" id="saqla">Saqlash</button>
    <p id="xato" class="xato">Ma'lumotlar yuklanmoqda...</p>
  </form>

  <!-- Saqlangandan keyin -->
  <section id="tayyor" class="panel" hidden>
    <div class="qoldiq">
      <span>✅ Saqlandi</span>
      <b id="yangiQoldiq"></b>
      <small id="yangiIzoh"></small>
    </div>
    <a id="nakladnoy" class="tugma-ikkinchi" href="#" hidden>🧾 Nakladnoy chop etish</a>
    <button type="button" id="yana">Yana yozuv qo'shish</button>
    <a id="sverkaga" class="tugma-ikkinchi" href="sverka.html">Sverkani ko'rish</a>
  </section>

  <script type="module">
    import { db, loginShart, pul, toza, kalit, mos, saralash, hammasi, valyuta, belgi } from './db.js';
    import { tarmoqXatosi, navbatgaQosh, navbat } from './navbat.js';

    const user = await loginShart('yozuv');

    const $ = (id) => document.getElementById(id);
    const MAHSULOTLI = ['yuk_berildi', 'mahsulot_olindi'];
    const TUSHUNTIR = {
      yuk_berildi:     'Mijozning qarzi oshadi (+)',
      tolov_keldi:     'Mijozning qarzi kamayadi (−)',
      mahsulot_olindi: 'Bizning qarzimiz oshadi (−)',
      pul_berildi:     'Bizning qarzimiz kamayadi (+)',
    };

    // "1 250 000,5" → 1250000.5 ; bo'sh bo'lsa null
    function son(s) {
      const t = String(s).replace(/\s/g, '').replace(',', '.');
      if (!t) return null;
      const n = Number(t);
      return Number.isFinite(n) ? n : NaN;
    }
    const bugun = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD

    // ---------- Ma'lumotlarni yuklash ----------
    const [mj, mh, mn] = await Promise.all([
      // '*' — valyuta ustuni (09-SQL) bo'lsa u ham keladi
      hammasi(() => db.from('mijoz_qoldiq').select('*').order('nomi').order('id')),   // 1000 tadan ko'p bo'lsa ham
      db.from('mahsulotlar').select('id, nomi, olchov, oxirgi_narx').order('nomi'),
      hammasi(() => db.from('mijoz_narx').select('mijoz_id, mahsulot_id, narx').order('mijoz_id')),
    ]);
    // Internetsiz: oxirgi yuklangan ro'yxatlar telefondan olinadi
    const KESH = 'lumant_kesh_yozuv';
    let internetsiz = false;
    if (mj.error || mh.error) {
      const e = mj.error || mh.error;
      let k = null;
      try { k = JSON.parse(localStorage[KESH] || 'null'); } catch {}
      if (!tarmoqXatosi(e) || !k) { $('xato').textContent = tarmoqXatosi(e) ? 'Internet yo\'q. Bir marta internet bilan oching — keyin internetsiz ham ishlaydi.' : 'Xato: ' + e.message; throw e; }
      internetsiz = true;
      mj.data = k.mijozlar; mh.data = k.mahsulotlar; mn.data = k.maxsus;
    } else {
      try { localStorage[KESH] = JSON.stringify({ mijozlar: mj.data.map(m => ({ id: m.id, nomi: m.nomi, qoldiq: m.qoldiq, valyuta: m.valyuta })),
        mahsulotlar: mh.data, maxsus: mn.data || [] }); } catch {}
    }
    $('xato').textContent = internetsiz ? '📴 Internet yo\'q — yozuvlar telefonda saqlanadi va internet qaytganda o\'zi yuboriladi' : '';
    const mijozlar = mj.data;
    const mahsulotlar = mh.data;
    // Maxsus narxlar (09-SQL'gacha bo'sh)
    const maxsus = new Map((mn.data || []).map(x => [x.mijoz_id + '-' + x.mahsulot_id, Number(x.narx)]));
    const usd = () => valyuta(mijoz) === 'USD';
    $('mahsulot').innerHTML += mahsulotlar.map(m =>
      `<option value="${toza(m.id)}">${toza(m.nomi)}</option>`).join('');

    // ---------- Holat ----------
    let turi = 'yuk_berildi';
    let mijoz = null;
    let summaQolda = false;   // summani foydalanuvchi o'zi yozganmi
    let kassa = 'naqd';       // to'lov qaysi kassaga tushadi
    let buyurtma = null;      // buyurtma.html dan ochilgan bo'lsa

    function kassaTanla(k) {
      kassa = k;
      document.querySelectorAll('#kassalar button').forEach(b =>
        b.classList.toggle('tanlangan', b.dataset.k === k));
    }
    $('kassalar').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-k]');
      if (b) kassaTanla(b.dataset.k);
    });

    function turTanla(t) {
      turi = t;
      document.querySelectorAll('#turlar button').forEach(b =>
        b.classList.toggle('tanlangan', b.dataset.tur === t));
      $('mahsulotQism').hidden = !MAHSULOTLI.includes(t);
      $('kassaQism').hidden = MAHSULOTLI.includes(t);
      $('tushuntir').textContent = TUSHUNTIR[t];
      // Avtomatik hisoblangan summa boshqa turga o'tganda qolib ketmasin
      if (!summaQolda) $('summa').value = '';
      hisobla();
    }
    $('turlar').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tur]');
      if (b) turTanla(b.dataset.tur);
    });

    // ---------- Mijoz qidiruvi ----------
    const qidir = $('qidir'), takliflar = $('takliflar');

    function mijozTanla(m) {
      mijoz = m;
      qidir.value = m.nomi;
      takliflar.hidden = true;
      $('mijozHolat').textContent = 'Hozirgi qoldiq: ' + pul(m.qoldiq) + ' ' + belgi(valyuta(m)) +
        (usd() ? ' · hisob dollarda' : '');
      // Dollar mijoz — faqat Dollar kassa; so'm mijoz — Dollar kassasiz
      document.querySelectorAll('#kassalar button').forEach(b => { b.hidden = usd() !== (b.dataset.k === 'dollar'); });
      kassaTanla(usd() ? 'dollar' : (kassa === 'dollar' ? 'naqd' : kassa));
      $('summaBelgi').textContent = usd() ? '($)' : '';
      narxQoy();
    }

    qidir.addEventListener('input', () => {
      mijoz = null;
      $('mijozHolat').textContent = '';
      $('summaBelgi').textContent = '';
      const soz = qidir.value.trim();
      if (!soz) { takliflar.hidden = true; return; }
      const topildi = saralash(mijozlar.filter(m => mos(m.nomi, soz)), soz).slice(0, 15);
      // lotin/kirillda bir xil nomli mijoz bo'lsa — yangisini taklif qilmaymiz (takror bo'lmasin)
      const aniq = mijozlar.some(m => kalit(m.nomi) === kalit(soz));
      takliflar.innerHTML = topildi.map(m =>
        `<li data-id="${toza(m.id)}"><span>${toza(m.nomi)}</span><small>${pul(m.qoldiq)}</small></li>`
      ).join('') + (aniq ? '' : `<li data-yangi="1">➕ Yangi mijoz: <b>${toza(qidir.value.trim())}</b></li>`);
      takliflar.hidden = false;
    });

    takliflar.addEventListener('click', async (e) => {
      const li = e.target.closest('li');
      if (!li) return;
      if (li.dataset.id) return mijozTanla(mijozlar.find(m => m.id == li.dataset.id));
      if (li.dataset.yangi) {
        const nomi = qidir.value.trim();
        if (!confirm(`"${nomi}" yangi mijoz sifatida qo'shilsinmi?`)) return;
        const { data, error } = await db.from('mijozlar').insert({ nomi }).select('id, nomi').single();
        if (error) { $('xato').textContent = tarmoqXatosi(error) ? 'Internetsiz yangi mijoz qo\'shib bo\'lmaydi — ro\'yxatdagisini tanlang' : 'Mijoz qo\'shilmadi: ' + error.message; return; }
        const yangi = { ...data, qoldiq: 0 };
        mijozlar.push(yangi);
        mijozlar.sort((a, b) => a.nomi.localeCompare(b.nomi));
        mijozTanla(yangi);
      }
    });

    // ---------- Mahsulot, miqdor, narx → summa ----------
    $('mahsulot').addEventListener('change', () => {
      const m = mahsulotlar.find(x => x.id == $('mahsulot').value);
      $('olchov').textContent = m?.olchov ? `(${m.olchov})` : '';
      narxQoy(true);
    });
    // Narx: shu mijozning maxsus narxi bo'lsa — o'sha, bo'lmasa oxirgi narx (dollar mijozda — faqat maxsus)
    function narxQoy(mahsulotAlmashdi) {
      const m = mahsulotlar.find(x => x.id == $('mahsulot').value);
      const mx = m && mijoz ? maxsus.get(mijoz.id + '-' + m.id) : undefined;
      $('narxIzoh').textContent = mx !== undefined ? '(maxsus narx)' : '';
      if (mx !== undefined) $('narx').value = pul(mx);
      else if (mahsulotAlmashdi && m?.oxirgi_narx && !usd()) $('narx').value = pul(m.oxirgi_narx);
      else if (mahsulotAlmashdi && usd()) $('narx').value = '';
      hisobla();
    }
    $('miqdor').addEventListener('input', hisobla);
    $('narx').addEventListener('input', hisobla);
    $('summa').addEventListener('input', () => { summaQolda = $('summa').value.trim() !== ''; });

    function hisobla() {
      if (!MAHSULOTLI.includes(turi) || summaQolda) return;
      const miqdor = son($('miqdor').value), narx = son($('narx').value);
      $('summa').value = (miqdor > 0 && narx > 0) ? pul(miqdor * narx) : '';
    }

    // ---------- Saqlash ----------
    $('forma').addEventListener('submit', async (e) => {
      e.preventDefault();
      const xato = $('xato');
      xato.textContent = '';

      if (!mijoz) { xato.textContent = 'Mijozni ro\'yxatdan tanlang'; qidir.focus(); return; }

      const yozuv = { sana: $('sana').value, mijoz_id: mijoz.id, turi, izoh: $('izoh').value.trim() || null };
      const summa = son($('summa').value);

      if (MAHSULOTLI.includes(turi)) {
        const m = mahsulotlar.find(x => x.id == $('mahsulot').value);
        const miqdor = son($('miqdor').value), narx = son($('narx').value);
        if (!m) { xato.textContent = 'Mahsulotni tanlang'; return; }
        if (!(miqdor > 0)) { xato.textContent = 'Miqdorni to\'g\'ri yozing'; return; }
        if (Number.isNaN(narx) || narx < 0) { xato.textContent = 'Narxni to\'g\'ri yozing'; return; }
        Object.assign(yozuv, {
          mahsulot_id: m.id, olchov: m.olchov, miqdor, narx,
          avto_raqami: $('avto').value.trim() || null,
        });
      }
      if (!(summa > 0)) { xato.textContent = 'Summani to\'g\'ri yozing'; return; }
      if (!MAHSULOTLI.includes(turi)) yozuv.kassa = kassa;   // kassaga o'zi tushadi
      yozuv.summa = summa;   // belgini (+/−) baza o'zi qo'yadi
      if (crypto.randomUUID) yozuv.client_id = crypto.randomUUID();   // internetsiz navbatda ikki marta tushmasin

      const tugma = $('saqla');
      tugma.disabled = true;
      tugma.textContent = 'Saqlanmoqda...';
      // Bazada yangi ustun hali yo'q bo'lsa (kassa — 03, client_id — 11) — o'sha ustunsiz qayta urinamiz
      let yangi, error, kassasiz = false;
      for (let urinish = 0; urinish < 3; urinish++) {
        ({ data: yangi, error } = await db.from('yozuvlar').insert(yozuv).select('id').single());
        const ustunYoq = error && (error.code === 'PGRST204' || error.code === '42703' || /column|does not exist/i.test(error.message || ''));
        const ustun = ustunYoq && ['kassa', 'client_id'].find(u => u in yozuv && (error.message || '').includes(u));
        if (!ustun) break;
        delete yozuv[ustun];
        if (ustun === 'kassa') kassasiz = true;
      }
      tugma.disabled = false;
      tugma.textContent = 'Saqlash';
      if (error && tarmoqXatosi(error)) {
        const n = navbatgaQosh(yozuv, mijoz.nomi);
        $('yangiQoldiq').textContent = '📴 Telefonda saqlandi';
        $('yangiIzoh').textContent = `Internet yo'q. Navbatda ${n} ta yozuv — internet qaytganda o'zi yuboriladi.`;
        $('nakladnoy').hidden = true;
        $('forma').hidden = true;
        $('tayyor').hidden = false;
        return;
      }
      if (error) { xato.textContent = 'Saqlanmadi: ' + error.message; return; }

      // Mahsulotning oxirgi narxini yangilab qo'yamiz (keyingi safar o'zi chiqadi)
      // (dollar mijozda va maxsus narxda — yo'q: ular umumiy narx emas)
      if (yozuv.mahsulot_id && yozuv.narx && !usd() && maxsus.get(mijoz.id + '-' + yozuv.mahsulot_id) !== yozuv.narx) {
        const m = mahsulotlar.find(x => x.id === yozuv.mahsulot_id);
        if (m.oxirgi_narx != yozuv.narx) {
          m.oxirgi_narx = yozuv.narx;
          await db.from('mahsulotlar').update({ oxirgi_narx: yozuv.narx }).eq('id', m.id);
        }
      }

      // Yangi qoldiqni bazadan olamiz
      const { data: q } = await db.from('mijoz_qoldiq').select('qoldiq').eq('id', mijoz.id).single();
      const qoldiq = Number(q?.qoldiq ?? 0);
      mijoz.qoldiq = qoldiq;
      // Buyurtmadan ochilgan bo'lsa — buyurtma bajarildi
      let buyIzoh = '';
      if (buyurtma && yangi?.id) {
        const { error: be } = await db.from('buyurtmalar').update({ holat: 'bajarildi', yozuv_id: yangi.id }).eq('id', buyurtma.id);
        buyIzoh = be ? ' · Buyurtma belgilanmadi: ' + be.message : ' · Buyurtma bajarildi ✅';
        buyurtma = null;
      }
      $('nakladnoy').hidden = !(yangi?.id && turi === 'yuk_berildi');
      if (yangi?.id) $('nakladnoy').href = 'nakladnoy.html?id=' + yangi.id;
      $('yangiQoldiq').textContent = mijoz.nomi + ': ' + pul(qoldiq) + ' ' + belgi(valyuta(mijoz));
      $('yangiIzoh').textContent =
        (qoldiq > 0 ? 'Mijoz bizdan qarz' : qoldiq < 0 ? 'Biz mijozdan qarzmiz (avans)' : 'Hisob yopiq') +
        (kassasiz ? ' · Kassa hali sozlanmagan, kassaga tushmadi' : '') + buyIzoh;
      $('sverkaga').href = 'sverka.html?mijoz=' + encodeURIComponent(mijoz.id);
      $('forma').hidden = true;
      $('tayyor').hidden = false;
    });

    // ---------- Yana yozuv: sana va mijoz qoladi, qolgani tozalanadi ----------
    $('yana').addEventListener('click', () => {
      ['miqdor', 'narx', 'summa', 'avto', 'izoh'].forEach(id => $(id).value = '');
      $('mahsulot').value = '';
      $('olchov').textContent = '';
      summaQolda = false;
      if (mijoz) mijozTanla(mijoz);
      $('tayyor').hidden = true;
      $('forma').hidden = false;
    });

    // ---------- Boshlang'ich holat ----------
    $('sana').value = bugun();
    kassaTanla('naqd');
    // Kassir faqat to'lov yozuvlarini kiritadi (bazada ham shunday cheklangan)
    if (user.rol === 'kassir') {
      document.querySelectorAll('[data-tur=yuk_berildi], [data-tur=mahsulot_olindi]').forEach(b => b.hidden = true);
      turTanla('tolov_keldi');
    } else turTanla('yuk_berildi');
    const url = new URLSearchParams(location.search);
    const oldin = mijozlar.find(m => m.id == url.get('mijoz'));
    if (oldin) mijozTanla(oldin);

    // Buyurtmadan: "buyurtma.html → Yetkazildi" — forma oldindan to'ldiriladi
    if (url.get('buyurtma') && user.rol !== 'kassir') {
      const { data: b } = await db.from('buyurtmalar').select('*').eq('id', url.get('buyurtma')).maybeSingle();
      const bm = b && mijozlar.find(m => m.id === b.mijoz_id);
      if (b && bm && b.holat === 'yangi') {
        buyurtma = b;
        turTanla('yuk_berildi');
        mijozTanla(bm);
        $('mahsulot').value = b.mahsulot_id;
        $('mahsulot').dispatchEvent(new Event('change'));
        $('miqdor').value = pul(b.miqdor);
        if (b.narx != null) $('narx').value = pul(b.narx);
        $('avto').value = b.avto_raqami || '';
        $('izoh').value = [b.manzil, b.izoh].filter(Boolean).join(' · ');
        hisobla();
        $('xato').textContent = `📋 Buyurtma № ${b.id} — tekshirib, "Saqlash" ni bosing`;
      }
    }
  </script>
</body>
</html>
