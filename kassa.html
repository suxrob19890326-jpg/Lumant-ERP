<!DOCTYPE html>
<!-- Kassa: naqd / karta / bank qoldig'i, kunlik kirim-chiqim, yangi yozuv -->
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kassa · Lumant ERP</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8731A">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase kutubxonasi: bitta fayl, o'zimizning saytdan (tez yuklanadi) -->
  <script src="vendor/supabase-2.119.2.js" defer></script>
  <link rel="modulepreload" href="db.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="qidiruv.js">
</head>
<body>
  <header class="kichik">
    <a href="index.html" class="orqaga">‹ Menyu</a>
    <h1>Kassa</h1>
  </header>

  <!-- 1) Qoldiqlar -->
  <section class="panel">
    <div class="kassa-qoldiq">
      <div><span>💵 Naqd</span><b id="q_naqd">…</b></div>
      <div><span>💳 Karta</span><b id="q_karta">…</b></div>
      <div><span>🏦 Bank</span><b id="q_bank">…</b></div>
      <div id="dollarKassa" hidden><span>💲 Dollar</span><b id="q_dollar">…</b></div>
    </div>
    <p class="jami">Jami: <b id="q_jami">…</b></p>
    <p id="holat" class="xato"></p>
  </section>

  <!-- 2) Yangi kassa yozuvi -->
  <form id="forma" class="panel" autocomplete="off" onsubmit="event.preventDefault()">
    <div class="turlar uch" id="yonalishlar">
      <button type="button" data-y="kirim">⬆️ Kirim</button>
      <button type="button" data-y="chiqim">⬇️ Chiqim</button>
      <button type="button" data-y="otkazma">🔁 O'tkazma</button>
    </div>

    <div id="bittaKassa">
      <label>Kassa</label>
      <div class="turlar uch kassa-tanla" data-nom="kassa"></div>
    </div>
    <div id="ikkiKassa" class="ikki">
      <div><label>Qayerdan</label><div class="turlar ustun kassa-tanla" data-nom="dan"></div></div>
      <div><label>Qayerga</label><div class="turlar ustun kassa-tanla" data-nom="ga"></div></div>
    </div>

    <div class="ikki">
      <label>Summa <input id="summa" inputmode="decimal" placeholder="0"></label>
      <label>Sana <input id="sana" type="date" required></label>
    </div>
    <label id="toifaQism">Toifa
      <input id="toifa" list="toifalar" placeholder="tanlang yoki yozing">
    </label>
    <datalist id="toifalar"></datalist>
    <label id="ishchiQism" hidden>Kimga (ishchi) <select id="ishchi"><option value="">— tanlang —</option></select></label>
    <label id="avtoQism" hidden>Qaysi mashina <input id="avto" list="avtolar" placeholder="01 A 123 BC"></label>
    <datalist id="avtolar"></datalist>
    <label>Izoh <input id="izoh" placeholder="ixtiyoriy"></label>

    <button type="submit" id="saqla">Saqlash</button>
    <p id="xato" class="xato"></p>
  </form>

  <!-- 3) Kunlik ro'yxat -->
  <section class="panel">
    <div class="kun">
      <button type="button" id="oldingi" aria-label="Oldingi kun">‹</button>
      <input id="kun" type="date">
      <button type="button" id="keyingi" aria-label="Keyingi kun">›</button>
    </div>
    <p class="kun-jami">
      <span class="kirim">+<b id="kunKirim">0</b></span>
      <span class="chiqim">−<b id="kunChiqim">0</b></span>
    </p>
    <div id="qatorlar"></div>
  </section>

  <!-- 4) Kunni yopish: kassadagi pulni sanab, tizim bilan solishtirish -->
  <section class="panel" id="yopishQism" hidden>
    <h2 class="kichik-sarlavha">🔒 Kunni yopish (bugun)</h2>
    <p class="tushuntir">Kassadagi pulni sanab yozing. Farq bo'lsa, rahbarga Telegram orqali xabar boradi.</p>
    <div id="yopishMaydon"></div>
    <label>Izoh <input id="yIzoh" placeholder="farq sababi (bo'lsa)"></label>
    <button type="button" id="ySaqla">Kunni yopish</button>
    <p id="yXabar" class="xato"></p>
    <button type="button" class="tugma-oddiy" id="yFarq" hidden>Farqni kassaga yozish (hisobni to'g'rilash)</button>
    <div id="yTarix"></div>
  </section>

  <script type="module">
    import { db, loginShart, pul, toza } from './db.js';

    const user = await loginShart('kassa');

    const $ = (id) => document.getElementById(id);
    const KASSA = { naqd: '💵 Naqd', karta: '💳 Karta', bank: '🏦 Bank' };   // + dollar (09-SQL bo'lsa)
    const TOIFA = {
      kirim:  ["Boshlang'ich qoldiq", 'Valyuta ayirboshlash', 'Boshqa kirim'],
      chiqim: ['Valyuta ayirboshlash', 'Oylik', 'Avans (xodim)', "Yoqilg'i", "Ta'mirlash", 'Ehtiyot qism', 'Kommunal',
               'Soliq', 'Ijara', 'Transport', 'Ovqat', 'Boshqa xarajat'],
    };

    // "1 250 000,5" → 1250000.5 ; bo'sh bo'lsa null
    function son(s) {
      const t = String(s).replace(/\s/g, '').replace(',', '.');
      if (!t) return null;
      const n = Number(t);
      return Number.isFinite(n) ? n : NaN;
    }
    const bugun = () => new Date().toLocaleDateString('sv-SE');
    function kunQosh(s, n) {
      const d = new Date(s + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return d.toLocaleDateString('sv-SE');
    }

    // ---------- Forma holati ----------
    let yonalish = 'chiqim';
    const tanlov = { kassa: 'naqd', dan: 'naqd', ga: 'bank' };

    function kassaTugmalar() {
      document.querySelectorAll('.kassa-tanla').forEach(div => {
        div.innerHTML = Object.entries(KASSA).map(([k, v]) =>
          `<button type="button" data-k="${k}">${v}</button>`).join('');
      });
      chizKassa();
    }
    document.querySelectorAll('.kassa-tanla').forEach(div => {
      div.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-k]');
        if (b) { tanlov[div.dataset.nom] = b.dataset.k; chizKassa(); }
      });
    });
    function chizKassa() {
      document.querySelectorAll('.kassa-tanla').forEach(div =>
        div.querySelectorAll('button').forEach(b =>
          b.classList.toggle('tanlangan', b.dataset.k === tanlov[div.dataset.nom])));
    }

    function yonalishTanla(y) {
      yonalish = y;
      document.querySelectorAll('#yonalishlar button').forEach(b =>
        b.classList.toggle('tanlangan', b.dataset.y === y));
      const otk = y === 'otkazma';
      $('bittaKassa').hidden = otk;
      $('ikkiKassa').hidden = !otk;
      $('toifaQism').hidden = otk;
      $('toifalar').innerHTML = (TOIFA[y] || []).map(t => `<option value="${toza(t)}">`).join('');
      $('toifa').value = '';
      toifaTekshir();
    }
    // Oylik/avans — ishchiga; yoqilg'i/ta'mir — mashinaga bog'lanadi (11-SQL bo'lsa)
    const ISHCHI_TOIFA = /oylik|avans/i, AVTO_TOIFA = /yoqilg|ta'mir|ehtiyot|transport/i;
    function toifaTekshir() {
      const t = $('toifa').value, chiq = yonalish === 'chiqim';
      $('ishchiQism').hidden = !(v11 && chiq && ISHCHI_TOIFA.test(t));
      $('avtoQism').hidden = !(v11 && chiq && AVTO_TOIFA.test(t));
    }
    $('yonalishlar').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-y]');
      if (b) yonalishTanla(b.dataset.y);
    });

    // ---------- Qoldiqlar ----------
    async function qoldiqlar() {
      const { data, error } = await db.from('kassa_qoldiq').select('kassa, qoldiq');
      if (error) {
        $('holat').textContent = /kassa_qoldiq|schema cache|does not exist/i.test(error.message)
          ? 'Kassa jadvali hali bazada yo\'q: supabase/03_kassa.sql ni ishga tushiring.'
          : 'Xato: ' + error.message;
        return false;
      }
      let jami = 0;
      if (data.some(r => r.kassa === 'dollar') && !KASSA.dollar) {
        KASSA.dollar = '💲 Dollar';
        $('dollarKassa').hidden = false;
        document.querySelector('.kassa-qoldiq').classList.add('tort');
        kassaTugmalar();
      }
      for (const r of data) {
        const el = $('q_' + r.kassa);
        if (el) {
          el.textContent = pul(r.qoldiq);
          el.classList.toggle('manfiy', Number(r.qoldiq) < 0);
        }
        if (r.kassa !== 'dollar') jami += Number(r.qoldiq);   // dollar — alohida
      }
      $('q_jami').textContent = pul(jami) + ' so\'m';
      return true;
    }

    // ---------- Kunlik ro'yxat ----------
    let soralgan = 0;
    async function royxat() {
      const kun = $('kun').value;
      const men = ++soralgan;
      $('qatorlar').innerHTML = '<p class="soni">Yuklanmoqda...</p>';
      const { data, error } = await db.from('kassa_yozuvlar')
        .select('id, sana, kassa, yonalish, summa, toifa, izoh, yozuv_id, yozuvlar(mijozlar(nomi))')
        .eq('sana', kun).order('id', { ascending: false });
      if (men !== soralgan) return;
      if (error) { $('qatorlar').innerHTML = `<p class="xato">Xato: ${toza(error.message)}</p>`; return; }

      let kirim = 0, chiqim = 0;
      $('qatorlar').innerHTML = data.map(r => {
        const s = Number(r.summa);
        const usd = r.kassa === 'dollar';
        if (!usd) { if (r.yonalish === 'kirim') kirim += s; else chiqim += s; }
        const mijoz = r.yozuvlar?.mijozlar?.nomi;
        const nomi = mijoz ? `${toza(r.toifa)}: ${toza(mijoz)}` : (toza(r.toifa) || (r.yonalish === 'kirim' ? 'Kirim' : 'Chiqim'));
        return `<div class="yozuv ${r.yonalish}">
          <div class="yuqori">
            <span class="nomi">${nomi}</span>
            <span class="summa">${r.yonalish === 'kirim' ? '+' : '−'}${pul(s)}${usd ? ' $' : ''}</span>
          </div>
          <div class="pastki">
            <span>${toza(r.izoh)}</span>
            <span class="q">${KASSA[r.kassa] || toza(r.kassa)}</span>
          </div>
        </div>`;
      }).join('') || '<p class="soni">Bu kunda yozuv yo\'q</p>';
      $('kunKirim').textContent = pul(kirim);
      $('kunChiqim').textContent = pul(chiqim);
    }

    function kunTanla(s) {
      $('kun').value = s;
      $('keyingi').disabled = s >= bugun();
      royxat();
    }
    $('kun').addEventListener('change', () => kunTanla($('kun').value || bugun()));
    $('oldingi').addEventListener('click', () => kunTanla(kunQosh($('kun').value, -1)));
    $('keyingi').addEventListener('click', () => kunTanla(kunQosh($('kun').value, 1)));

    // ---------- Saqlash ----------
    $('forma').addEventListener('submit', async () => {
      const xato = $('xato');
      xato.textContent = '';
      const summa = son($('summa').value);
      if (!(summa > 0)) { xato.textContent = 'Summani to\'g\'ri yozing'; $('summa').focus(); return; }
      const sana = $('sana').value;
      if (!sana) { xato.textContent = 'Sanani tanlang'; return; }
      const izoh = $('izoh').value.trim() || null;

      let qatorlar;
      if (yonalish === 'otkazma') {
        if (tanlov.dan === tanlov.ga) { xato.textContent = 'Qayerdan va qayerga bir xil bo\'lmasin'; return; }
        if ((tanlov.dan === 'dollar') !== (tanlov.ga === 'dollar')) {
          xato.textContent = 'Dollar ↔ so\'m o\'tkazib bo\'lmaydi (summalar har xil). "Chiqim" (Dollar kassadan) va "Kirim" (so\'m kassaga) qiling, toifa: Valyuta ayirboshlash.';
          return;
        }
        const toifa = 'O\'tkazma';
        qatorlar = [
          { sana, kassa: tanlov.dan, yonalish: 'chiqim', summa, toifa, izoh },
          { sana, kassa: tanlov.ga,  yonalish: 'kirim',  summa, toifa, izoh },
        ];
      } else {
        const toifa = $('toifa').value.trim();
        if (!toifa) { xato.textContent = 'Toifani tanlang yoki yozing'; $('toifa').focus(); return; }
        qatorlar = [{ sana, kassa: tanlov.kassa, yonalish, summa, toifa, izoh }];
        if (!$('ishchiQism').hidden && $('ishchi').value) qatorlar[0].ishchi_id = Number($('ishchi').value);
        if (!$('avtoQism').hidden && $('avto').value.trim()) qatorlar[0].avto_raqami = $('avto').value.trim();
      }

      const tugma = $('saqla');
      tugma.disabled = true;
      tugma.textContent = 'Saqlanmoqda...';
      const { error } = await db.from('kassa_yozuvlar').insert(qatorlar);   // bitta so'rov: ikkalasi birga
      tugma.disabled = false;
      tugma.textContent = 'Saqlash';
      if (error) { xato.textContent = 'Saqlanmadi: ' + error.message; return; }

      ['summa', 'toifa', 'izoh', 'avto'].forEach(id => $(id).value = '');
      $('ishchi').value = ''; toifaTekshir();
      xato.textContent = '';
      $('saqla').textContent = '✅ Saqlandi';
      setTimeout(() => { if (!tugma.disabled) tugma.textContent = 'Saqlash'; }, 1500);
      await qoldiqlar();
      kunTanla(sana);
    });

    // ---------- 11-SQL: ishchilar, mashinalar, kunni yopish ----------
    let v11 = false, oxirgiQoldiq = [];
    const ish = await db.from('ishchilar').select('id, ism, faol').order('ism');
    if (!ish.error) {
      v11 = true;
      $('ishchi').innerHTML += ish.data.filter(x => x.faol).map(x => `<option value="${x.id}">${toza(x.ism)}</option>`).join('');
      const av = await db.from('yozuvlar').select('avto_raqami').eq('turi', 'yuk_berildi').not('avto_raqami', 'is', null)
        .order('id', { ascending: false }).limit(500);
      const avtolar = [...new Set((av.data || []).map(x => x.avto_raqami.trim().toUpperCase()))];
      $('avtolar').innerHTML = avtolar.map(a => `<option value="${toza(a)}">`).join('');
      $('yopishQism').hidden = false;
    }
    $('toifa').addEventListener('input', toifaTekshir);

    async function yopishChiz() {
      if (!v11) return;
      const { data } = await db.from('kassa_qoldiq').select('kassa, qoldiq');
      oxirgiQoldiq = data || [];
      $('yopishMaydon').innerHTML = '<div class="ikki">' + oxirgiQoldiq.filter(r => KASSA[r.kassa]).map(r => `
        <label>${KASSA[r.kassa]} <small class="soni">hisobda ${pul(r.qoldiq)}</small>
          <input data-yop="${r.kassa}" inputmode="decimal" placeholder="sanaldi"></label>`).join('') + '</div>';
      const t = await db.from('kassa_yopish').select('sana, kassa, hisobda, sanaldi, farq, izoh').order('sana', { ascending: false }).order('kassa').limit(20);
      $('yTarix').innerHTML = (t.data || []).length ? '<h2 class="kichik-sarlavha">Oxirgi yopilishlar</h2>' + t.data.map(x => `
        <div class="yozuv"><div class="yuqori"><span class="sana">${x.sana.split('-').reverse().join('.')}</span>
          <span class="nomi">${KASSA[x.kassa] || toza(x.kassa)}</span>
          <span class="summa ${Math.abs(x.farq) >= 1 ? 'manfiy' : 'kirim'}">${Math.abs(x.farq) >= 1 ? 'farq ' + pul(x.farq) : '✓ to\'g\'ri'}</span></div>
          ${x.izoh ? `<div class="pastki"><span>${toza(x.izoh)}</span></div>` : ''}</div>`).join('') : '';
    }
    let farqlar = [];
    $('ySaqla').addEventListener('click', async () => {
      const qatorlar = [...document.querySelectorAll('[data-yop]')].filter(i => i.value.trim() !== '').map(i => ({
        sana: bugun(), kassa: i.dataset.yop, hisobda: Number(oxirgiQoldiq.find(r => r.kassa === i.dataset.yop)?.qoldiq || 0),
        sanaldi: son(i.value), izoh: $('yIzoh').value.trim() || null,
      }));
      if (!qatorlar.length) { $('yXabar').textContent = 'Kamida bitta kassani sanab yozing'; return; }
      if (qatorlar.some(q => Number.isNaN(q.sanaldi) || q.sanaldi === null)) { $('yXabar').textContent = 'Summani to\'g\'ri yozing'; return; }
      const { error } = await db.from('kassa_yopish').upsert(qatorlar, { onConflict: 'sana,kassa' });
      if (error) { $('yXabar').textContent = 'Saqlanmadi: ' + error.message; $('yXabar').classList.remove('ok'); return; }
      farqlar = qatorlar.filter(q => Math.abs(q.sanaldi - q.hisobda) >= 1);
      $('yXabar').classList.toggle('ok', !farqlar.length);
      $('yXabar').textContent = farqlar.length
        ? '⚠️ Farq bor: ' + farqlar.map(q => `${KASSA[q.kassa]} ${pul(q.sanaldi - q.hisobda)}`).join(', ') + '. Rahbarga xabar yuborildi.'
        : '✅ Kun yopildi — hammasi to\'g\'ri';
      $('yFarq').hidden = !farqlar.length;
      yopishChiz();
    });
    $('yFarq').addEventListener('click', async () => {
      if (!confirm('Kassa qoldig\'i sanalgan summaga tenglashtirilsinmi?')) return;
      const { error } = await db.from('kassa_yozuvlar').insert(farqlar.map(q => ({
        sana: bugun(), kassa: q.kassa, yonalish: q.sanaldi > q.hisobda ? 'kirim' : 'chiqim',
        summa: Math.abs(q.sanaldi - q.hisobda), toifa: 'Kassa farqi', izoh: q.izoh,
      })));
      if (error) { $('yXabar').textContent = 'Yozilmadi: ' + error.message; return; }
      $('yFarq').hidden = true;
      $('yXabar').textContent = '✅ Kassa sanalgan summaga tenglashtirildi';
      $('yXabar').classList.add('ok');
      await qoldiqlar(); kunTanla(bugun()); yopishChiz();
    });

    // ---------- Boshlang'ich holat ----------
    yonalishTanla('chiqim');
    kassaTugmalar();
    $('sana').value = bugun();
    if (await qoldiqlar()) { kunTanla(bugun()); yopishChiz(); }
  </script>
</body>
</html>
